services:
  - type: web
    name: vehicle-reminder
    runtime: node
    plan: free
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.3
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://vehicle-reminder.onrender.com
